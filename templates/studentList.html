<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
    <style>
      table { border-collapse: collapse; margin-top: 15px; }
      th, td { border: 1px solid #ccc; padding: 6px 12px; }
      .btn-add {
        display: inline-block;
        padding: 6px 12px;
        background-color: #2ecc71;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .btn-add:hover { background-color: #27ae60; }
    </style>
  </head>
<body>
	<h1>List Students from table</h1>

	<a href="/student/add" class="btn-add">➕ 新增學生</a>

	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>{{ loop.index }}:<a href="/student/edit/{{ p.stuid }}">Edit</a></td>
		<td>{{ p.stuid }}</td>
		<td>
			{{ p.name }}
			<a href="/student/delete/{{ p.stuid }}" 
			   onclick="return confirm('確定要刪除學生 {{ p.name }} (學號 {{ p.stuid }}) 嗎？');" 
			   title="刪除" 
			   style="color: #e74c3c; text-decoration: none; font-weight: bold; margin-left: 6px; cursor: pointer;">
				&times;
			</a>
		</td>
	</tr>
	{% endfor %}
	</table>
</body>
</html>
